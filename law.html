---
title: Law clause
section: laws
scripts:
  - "ROOT/scripts/eliebermann.js"
  - "ROOT/scripts/lawpopup.js"
---
<article id="clause"><p class="loading">Loading clause…</p></article>

<script>
(function () {
    const root = window.SITE_ROOT || '';
    const target = document.getElementById('clause');
    const id = new URLSearchParams(location.search).get('id') || '';
    const NS = 'http://www.tei-c.org/ns/1.0';
    let catalogue = [];

    // Liebermann's volume 1 on archive.org, opened at a printed page in a new tab.
    // "445/6" or "450/451" (a clause running over two pages) opens at the first.
    const SCAN_URL = {{ site.laws_facsimile_url | jsonify }};
    const SCAN_ID = (/\/details\/([^/?#]+)/.exec(SCAN_URL || '') || [])[1] || '';
    function scanPage(page) {
        const m = /^\s*(\d+)/.exec(page || '');
        return m ? m[1] : '';
    }
    const scanLink = p => SCAN_URL.replace('{page}', p);

    const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
    };
    const first = (doc, sel) => doc.querySelector(sel);
    const tei = (doc, name) => [...doc.getElementsByTagNameNS(NS, name)];
    const fetchXml = file => fetch(root + 'oe-laws/' + file)
        .then(r => { if (!r.ok) throw new Error('missing'); return r.text(); })
        .then(t => new DOMParser().parseFromString(t, 'application/xml'));

    const LABELS = [
        ['selectedText', 'Text'],
        ['translation', 'Translation'],
        ['secondTranslation', 'Second translation'],
        ['supplementaryText', 'Supplementary manuscript'],
        ['supplementaryTranslation', 'Translation of the supplementary manuscript']
    ];

    // TEI inline markup as HTML: <hi rend="italic"> and <title> in italic.
    function inline(node) {
        const frag = document.createDocumentFragment();
        node.childNodes.forEach(n => {
            if (n.nodeType === 3) { frag.appendChild(document.createTextNode(n.nodeValue)); return; }
            if (n.nodeType !== 1) return;
            const name = n.localName;
            const italic = (name === 'hi' && /italic/.test(n.getAttribute('rend') || '')) || name === 'title';
            const out = el(italic ? (name === 'title' ? 'cite' : 'em') : 'span');
            out.appendChild(inline(n));
            frag.appendChild(out);
        });
        return frag;
    }
    const plainText = node => node.textContent.replace(/\s+/g, ' ').trim();

    // The editions and translations a clause file names (new layout only):
    // { liebermann: {name, ref, page}, oliver: {...}, ... }
    function sources(doc) {
        const out = {};
        tei(doc, 'listBibl').forEach(list => tei(list, 'bibl').forEach(b => {
            const id = b.getAttribute('xml:id') || b.getAttributeNS('http://www.w3.org/XML/1998/namespace', 'id');
            if (!id) return;
            const name = tei(doc, 'name').find(n => n.getAttribute('ref') === '#' + id);
            const page = tei(b, 'biblScope').find(s => s.getAttribute('unit') === 'page');
            out[id] = { id, bibl: b, name: name ? plainText(name) : id, page: page ? plainText(page) : '' };
        }));
        return out;
    }

    // A translator's or editor's surname, linked to the full reference at the foot of the page.
    function sourceLink(src) {
        const a = el('a', 'source-name', src.name);
        a.href = '#src-' + src.id;
        a.title = plainText(src.bibl);
        return a;
    }

    // The manuscripts a clause file names: { 'wit-h': {abbr: 'H', name: 'Rochester, …', selected} }
    function witnesses(doc) {
        const out = {};
        tei(doc, 'witness').forEach(w => {
            const id = w.getAttribute('xml:id') || w.getAttributeNS('http://www.w3.org/XML/1998/namespace', 'id');
            const abbr = tei(w, 'abbr')[0];
            const name = tei(w, 'note')[0];
            out[id || ''] = { abbr: abbr ? plainText(abbr) : plainText(w), name: name ? plainText(name) : '',
                              selected: w.getAttribute('rend') === 'bold' };
        });
        return out;
    }

    // "MS H", with the manuscript's full name on hover.
    function msLabel(a, wits, prefix) {
        const id = (a.getAttribute('corresp') || '').replace(/^#/, '');
        const w = wits[id];
        if (!id) return null;
        const s = el('span', 'ms-label', (prefix || 'MS ') + (w ? w.abbr : id.replace(/^wit-/, '').toUpperCase()));
        if (w && w.name) s.title = w.name;
        return s;
    }

    const LANG_NAMES = { de: 'German', la: 'Latin', xno: 'Anglo-Norman French' };

    // New layout: the texts on the left (Liebermann's manuscripts, then the
    // modern edition), the translations on the right, each labelled with its
    // source and the manuscript it comes from.
    function newTexts(doc, div, heading) {
        const wrap = el('div', 'clause-texts clause-texts--sources');
        wrap.appendChild(heading);
        const srcs = sources(doc);
        const wits = witnesses(doc);
        const grid = el('div', 'clause-grid');
        const col = (title, cls) => { const c = el('div', 'clause-col ' + cls); c.appendChild(el('h3', null, title)); grid.appendChild(c); return c; };
        const abs = tei(div, 'ab');
        const texts = abs.filter(a => /^(liebermannText|editionText)$/.test(a.getAttribute('type')));
        // Texts from the Quadripartitus (MS Q) have their own heading, unless
        // the clause survives only in Latin. Liebermann's texts come first, in
        // the order of his columns (his leftmost, main text first), then the
        // other editors'.
        const witOf = a => wits[(a.getAttribute('corresp') || '').replace(/^#/, '')] || {};
        const isQ = a => /^Q\b/.test(witOf(a).abbr || '');
        const hasOE = texts.some(a => a.getAttribute('xml:lang') === 'ang');
        const hasFrench = texts.some(a => a.getAttribute('xml:lang') === 'xno');
        const main = texts.filter(a => !(hasOE && isQ(a)));
        const quad = texts.filter(a => hasOE && isQ(a));
        const byEditor = list => list.filter(a => a.getAttribute('type') === 'liebermannText')
            .concat(list.filter(a => a.getAttribute('type') !== 'liebermannText'));
        const left = col(hasOE ? 'Old English text' : hasFrench ? 'Anglo-Norman French text' : 'Latin text', 'clause-col--text');
        const right = col('Translations', 'clause-col--translation');
        const add = (column, a, bits, cls) => {
            const id = (a.getAttribute('source') || '').replace(/^#/, '');
            const src = srcs[id] || { id, name: id || 'Unknown', bibl: a, page: '' };
            const box = el('div', 'clause-reading' + (cls ? ' ' + cls : ''));
            const label = el('p', 'clause-source');
            label.appendChild(sourceLink(src));
            bits.filter(Boolean).forEach(b => {
                label.appendChild(document.createTextNode(' · '));
                label.appendChild(typeof b === 'string' ? el('span', 'muted', b) : b);
            });
            box.appendChild(label);
            const p = el('p', 'clause-reading-text');
            const lang = a.getAttribute('xml:lang');
            if (lang && lang !== 'und') p.lang = lang;
            p.appendChild(inline(a));
            box.appendChild(p);
            // The translator's own footnotes (Whitelock's, from EHD), under her translation.
            // (Rabin's textual notes go under his text, the readings of the other manuscripts.)
            const noteType = { translation: 'translator', editionText: 'textual' }[a.getAttribute('type')];
            const own = noteType ? tei(div, 'note').filter(n => n.getAttribute('type') === noteType && (n.getAttribute('source') || '').replace(/^#/, '') === id) : [];
            if (own.length) {
                const ol = el('ol', 'clause-reading-notes small');
                ol.setAttribute('aria-label', src.name + (noteType === 'textual' ? '’s textual notes' : '’s notes'));
                own.forEach(n => { const li = el('li'); li.appendChild(inline(n)); ol.appendChild(li); });
                box.appendChild(ol);
            }
            column.appendChild(box);
        };
        const addText = (a, showLatin) => {
            const id = (a.getAttribute('source') || '').replace(/^#/, '');
            const src = srcs[id] || {};
            const lieb = a.getAttribute('type') === 'liebermannText';
            const n = a.getAttribute('n');
            add(left, a, [msLabel(a, wits),
                lieb ? (src.page ? 'Gesetze I, p. ' + src.page : '') : (n ? '§ ' + n : ''),
                !lieb && src.page ? 'p. ' + src.page : '',
                showLatin && a.getAttribute('xml:lang') === 'la' ? 'Latin' : '']);
        };
        byEditor(main).forEach(a => addText(a, hasOE));
        if (quad.length) {
            left.appendChild(el('h3', 'clause-subhead', 'Quadripartitus'));
            byEditor(quad).forEach(a => addText(a, false));
        }
        const trans = abs.filter(a => a.getAttribute('type') === 'translation');
        const isGerman = a => a.getAttribute('xml:lang') === 'de' || a.getAttribute('ana') === '#fromGerman';
        // Liebermann's German first, then Claude's English of it, then the other translations.
        trans.filter(a => a.getAttribute('xml:lang') === 'de').forEach(a => add(right, a, ['German translation']));
        trans.filter(a => a.getAttribute('ana') === '#fromGerman').forEach(a => add(right, a, ['English of Liebermann’s German']));
        trans.filter(a => !isGerman(a)).forEach(a => {
            const id = (a.getAttribute('source') || '').replace(/^#/, '');
            const src = srcs[id] || {};
            add(right, a, [msLabel(a, wits, 'of MS '), src.page ? 'p. ' + src.page : '']);
        });
        if (!trans.length) { right.remove(); grid.classList.add('clause-grid--single'); }
        wrap.appendChild(grid);
        tei(div, 'note').forEach(n => {
            const type = n.getAttribute('type');
            if (type !== 'passageSource' && type !== 'editorial') return;
            const p = el('p', 'clause-note small');
            p.appendChild(el('strong', null, type === 'passageSource' ? 'Source of the passage: ' : 'Notes: '));
            p.appendChild(inline(n));
            wrap.appendChild(p);
        });
        [['supplementaryText', 'Supplementary manuscript'], ['supplementaryTranslation', 'Translation of the supplementary manuscript']].forEach(([type, label]) => {
            abs.filter(a => a.getAttribute('type') === type).forEach(a => {
                const p = el('div', 'clause-text clause-' + type);
                p.appendChild(el('h3', null, label));
                const t = el('p');
                t.appendChild(inline(a));
                p.appendChild(t);
                wrap.appendChild(p);
            });
        });
        return wrap;
    }

    // The texts of one clause as a block of headed paragraphs.
    function texts(doc, heading) {
        const wrap = el('div', 'clause-texts');
        const div = tei(doc, 'div').find(d => d.getAttribute('type') === 'clause');
        if (!div) return wrap;
        // Files built from the laws database (Liebermann's texts and the editors'); Cn 1018 has only editors' texts.
        if (tei(div, 'ab').some(a => /^(liebermannText|editionText)$/.test(a.getAttribute('type')))) return newTexts(doc, div, heading);
        wrap.appendChild(heading);
        LABELS.forEach(([type, label]) => {
            tei(div, 'ab').filter(a => a.getAttribute('type') === type).forEach(a => {
                const p = el('div', 'clause-text clause-' + type);
                p.appendChild(el('h3', null, label));
                p.appendChild(el('p', null, a.textContent.trim()));
                wrap.appendChild(p);
            });
        });
        return wrap;
    }

    // The law code in the heading links to its page, which lists all its clauses.
    function codeLink(row) {
        const a = el('a', null, row.code);
        a.href = root + 'lawcode.html?code=' + encodeURIComponent(row.code) + '#' + encodeURIComponent(row.id);
        a.title = 'All the clauses of ' + row.code;
        return a;
    }

    function render(row, doc) {
        const h1 = el('h1');
        h1.appendChild(codeLink(row));
        h1.appendChild(document.createTextNode(row.clause ? ' ' + row.clause : ''));
        document.title = row.citation + ' · eLiebermann';

        target.textContent = '';
        const header = el('header', 'entry-header');
        header.appendChild(h1);
        const meta = el('div', 'meta');
        const isNew = tei(doc, 'ab').some(a => /^(liebermannText|editionText)$/.test(a.getAttribute('type')));
        const lawBibl = tei(doc, 'bibl').find(b => b.getAttribute('type') === 'legalText');
        if (isNew && lawBibl) {
            const t = tei(lawBibl, 'title')[0];
            const reign = tei(lawBibl, 'note').find(n => n.getAttribute('type') === 'reign');
            if (t) meta.appendChild(el('span', null, plainText(t)));
            if (reign) meta.appendChild(el('span', null, plainText(reign)));
        } else if (row.legalText) meta.appendChild(el('span', null, row.legalText));
        const promulg = first(doc, 'note[type="promulgation"]') || tei(doc, 'note').find(n => n.getAttribute('type') === 'promulgation');
        if (promulg && promulg.textContent.trim()) meta.appendChild(el('span', null, 'Promulgated: ' + promulg.textContent.trim()));
        const lieb = sources(doc).liebermann;
        const liebPage = isNew ? (lieb ? lieb.page : '') : row.page;
        const scanAt = SCAN_ID ? scanPage(liebPage) : '';
        if (liebPage) {
            const s = el('span', null, 'Liebermann, Gesetze I, p. ' + liebPage);
            if (scanAt) {
                s.appendChild(document.createTextNode(' · '));
                const a = el('a', null, 'page scan');
                a.href = scanLink(scanAt);
                a.target = '_blank';
                a.rel = 'noopener';
                s.appendChild(a);
            }
            meta.appendChild(s);
        }
        header.appendChild(meta);
        target.appendChild(header);

        const sec = el('section', 'entry-section');
        const t = texts(doc, el('span'));
        sec.appendChild(t);
        target.appendChild(sec);

        const wits = tei(doc, 'witness');
        if (wits.length) {
            const s = el('section', 'entry-section');
            s.appendChild(el('h2', null, 'Manuscripts'));
            const named = wits.some(w => tei(w, 'abbr').length);
            if (named) {
                const ul = el('ul', 'ms-list');
                Object.values(witnesses(doc)).forEach(w => {
                    const li = el('li');
                    li.appendChild(el('span', 'ms-siglum', w.abbr));
                    if (w.name) li.appendChild(document.createTextNode(' – ' + w.name));
                    ul.appendChild(li);
                });
                s.appendChild(ul);
            } else {
                const p = el('p');
                wits.forEach((w, i) => {
                    if (i) p.appendChild(document.createTextNode(', '));
                    p.appendChild(el(w.getAttribute('rend') === 'bold' ? 'strong' : 'span', null, w.textContent.trim()));
                });
                s.appendChild(p);
                s.appendChild(el('p', 'small muted', 'The manuscript in bold is the one the text above is taken from, where more than one is listed.'));
            }
            target.appendChild(s);
        }

        const kw = tei(doc, 'keywords').filter(k => k.textContent.trim());
        if (kw.length) {
            const s = el('section', 'entry-section');
            s.appendChild(el('h2', null, 'Keywords'));
            s.appendChild(el('p', 'small muted', 'Click a keyword to find the other clauses that have it.'));
            const names = { 'offence-legal-event': 'Offence / legal event', people: 'People', locations: 'Locations' };
            kw.forEach(k => {
                const p = el('p');
                p.appendChild(el('strong', null, (names[k.getAttribute('n')] || k.getAttribute('n') || 'Keywords') + ': '));
                tei(k, 'term').forEach((x, j) => {
                    if (j) p.appendChild(document.createTextNode('; '));
                    const a = el('a', null, x.textContent.trim());
                    a.href = root + 'laws.html?kw=' + encodeURIComponent(x.textContent.trim());
                    p.appendChild(a);
                });
                s.appendChild(p);
            });
            target.appendChild(s);
        }

        const srcs = Object.values(sources(doc));
        if (srcs.length) {
            const s = el('section', 'entry-section clause-sources');
            s.appendChild(el('h2', null, 'Editions and translations'));
            const ul = el('ul');
            srcs.forEach(x => {
                const li = el('li');
                li.id = 'src-' + x.id;
                li.appendChild(el('strong', null, x.name + ': '));
                li.appendChild(inline(x.bibl));
                ul.appendChild(li);
            });
            s.appendChild(ul);
            target.appendChild(s);
        }

        // Neighbouring clauses and the whole code
        const sameCode = catalogue.filter(c => c.code === row.code);
        const i = sameCode.findIndex(c => c.id === row.id);
        const nav = el('nav', 'clause-nav');
        const link = (c, label) => { const a = el('a', null, label); a.href = '?id=' + encodeURIComponent(c.id); return a; };
        nav.appendChild(i > 0 ? link(sameCode[i - 1], '← ' + sameCode[i - 1].citation) : el('span'));
        nav.appendChild(i < sameCode.length - 1 ? link(sameCode[i + 1], sameCode[i + 1].citation + ' →') : el('span'));
        target.appendChild(nav);

        const whole = el('section', 'entry-section');
        const btn = el('button', 'button', 'Show the whole of ' + row.code + ' (' + sameCode.length + ' clauses)');
        btn.type = 'button';
        const out = el('div', 'whole-code');
        btn.addEventListener('click', () => {
            btn.disabled = true;
            btn.textContent = 'Loading…';
            Promise.all(sameCode.map(c => fetchXml(c.file).then(d => ({ c, d })).catch(() => ({ c, d: null }))))
                .then(items => {
                    items.forEach(({ c, d }) => {
                        const h = el('h2', c.id === row.id ? 'current' : null);
                        h.id = c.id;
                        const a = el('a', null, c.citation);
                        a.href = '?id=' + encodeURIComponent(c.id);
                        h.appendChild(a);
                        if (d) out.appendChild(texts(d, h)); else { out.appendChild(h); out.appendChild(el('p', 'muted', 'This clause could not be loaded.')); }
                    });
                    btn.remove();
                    const cur = document.getElementById(row.id);
                    if (cur) cur.scrollIntoView();
                });
        });
        whole.appendChild(btn);
        whole.appendChild(out);
        target.appendChild(whole);
        if (new URLSearchParams(location.search).get('all') === '1') btn.click();

        const src = el('p', 'source-line');
        const changes = tei(doc, 'change');
        const checked = changes.filter(c => c.getAttribute('type') === 'checked');
        const made = changes.find(c => c.getAttribute('type') !== 'checked');
        src.appendChild(document.createTextNode((made ? plainText(made) : 'Made from the OE Laws spreadsheet, not yet checked against the print.') + ' '));
        checked.forEach(c => src.appendChild(document.createTextNode(plainText(c) + ' ')));
        const a = el('a', null, 'View the TEI file');
        a.href = root + 'oe-laws/' + encodeURIComponent(row.file);
        src.appendChild(a);
        target.appendChild(src);
    }

    if (!id) {
        target.innerHTML = '<h1>No clause chosen</h1><p>Clauses are reached from the law code citations at the foot of dictionary entries.</p>';
        return;
    }
    fetch(root + 'oe-laws/index.json')
        .then(r => r.json())
        .then(list => {
            catalogue = list;
            const row = list.find(c => c.id === id);
            if (!row) throw new Error('missing');
            return fetchXml(row.file).then(doc => render(row, doc));
        })
        .catch(() => {
            target.innerHTML = '';
            target.appendChild(el('h1', null, 'Clause not found'));
            target.appendChild(el('p', null, 'There is no clause "' + id + '" in the laws database.'));
        });
})();
</script>
